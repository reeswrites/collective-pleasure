id: E1-at-most-half
attribute: partner
deontic: must_not
aim: leave
conditions:
- {expr: pooled, op: gt, value: 25}
- {expr: take, op: gt, value: 50}
or_else: null
gloss: When the pooled share is more than 25 and the share taken is more than 50,
  a partner must not leave.
source: evolved (bound) from E1-at-most-half
