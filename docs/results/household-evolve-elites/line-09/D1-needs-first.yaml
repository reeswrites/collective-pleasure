id: D1-needs-first
attribute: partner
deontic: must_not
aim: spend_self
conditions:
- {expr: need_gap, op: gt, value: 0}
- {expr: money, op: ge, value: 4}
or_else: {kind: warn, duration_months: 1, sanctioner: household}
gloss: When the unfunded need is more than 0 and the private money is at least 4,
  a partner must not spend self. Breaking it brings a warn for 1 month(s).
source: evolved (add_condition) from D1-needs-first
