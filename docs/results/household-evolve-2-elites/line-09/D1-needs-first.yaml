id: D1-needs-first
attribute: partner
deontic: must_not
aim: spend_self
conditions:
- {expr: need_gap, op: gt, value: 0}
or_else: {kind: warn, duration_months: 2, sanctioner: household}
gloss: When the unfunded need is more than 0, a partner must not spend self. Breaking
  it brings a warn for 2 month(s).
source: evolved (sanction) from D1-needs-first
