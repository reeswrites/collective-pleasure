id: R8b-exit-terms-negotiated
attribute: partner
deontic: may
aim: leave
conditions: []
or_else: null
gloss: A partner who leaves takes the exit terms the members negotiated beforehand
  (the exit term of their agreed bundle), and never less than the exit floor; if no
  agreement exists there is no shared pot to split.
source: 'docs/seeds/author-household-norms-2026-11-10.md, the author''s words: "it
