  v2, "12-13 should be negotiated exit terms". Seed v2.2 (2026-11-10, pending author
  read-back): replaces the two even-split stand-in cards R8b and R8c (kept in git
  history). This card sets no split of its own: the split is the exit term of the
  negotiated bundle (cards N5), and the floor is card FLOOR-exit-floor (see rules/README.md);
  with no agreement the partners live apart and there is no pot.'
