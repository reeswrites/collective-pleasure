id: R6-no-veto
attribute: partner
deontic: must_not
aim: veto
conditions: []
or_else: null
gloss: 'A partner must not veto the other''s contact (seeing the friend) or spending
  of the other''s own money: a veto is the one way this world lets one partner control
  the other''s contact or money. The world has no veto on time, so time is not on
  this card; chosen commitments (R5) are the only way to bind.'
source: 'docs/seeds/author-household-norms-2026-11-10.md, "Correction after read-back"
  (2026-11-10), the author''s words: "request is never about contorl". Seed v2 rule
  R6 (the read-back correction for the missing "request is never about control").
  Gloss corrected 2026-11-10 to the author''s words: no veto over the other''s contact
  or money; the earlier gloss added "time" and "except through a commitment the other
  chose", neither of which the card or the world enforces (a time request is only
  a request; commitments are a separate mechanism). Other routes of pressure the world
  still permits and this card does not touch: requests for time (a request is only
  a request; the other may ignore it at a small friction cost). A veto is imposed,
  never chosen, so it is a hard wall; chosen commitments are the only way to bind
  (see R5). Seed v2.2 (2026-11-10, pending author read-back): R3b stays removed; pot
  terms are negotiated by everyone who shares the pot (docs/decisions/0013-negotiated-pots.md).'
