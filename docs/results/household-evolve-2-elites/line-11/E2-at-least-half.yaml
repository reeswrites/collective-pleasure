id: E2-at-least-half
attribute: partner
deontic: must_not
aim: leave
conditions:
- {expr: pooled, op: gt, value: 0}
- {expr: take, op: lt, value: 50}
or_else: {kind: suspend, duration_months: 1, sanctioner: household}
gloss: When the pooled share is more than 0 and the share taken is less than 50, a
  partner must not leave. Breaking it brings a suspend for 1 month(s).
source: evolved (sanction) from E2-at-least-half
