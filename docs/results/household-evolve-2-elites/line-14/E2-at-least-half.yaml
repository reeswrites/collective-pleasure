id: E2-at-least-half
attribute: partner
deontic: must_not
aim: leave
conditions:
- {expr: pooled, op: gt, value: 0}
- {expr: take, op: lt, value: 50}
- {expr: consented, op: eq, value: 1}
or_else: null
gloss: When the pooled share is more than 0 and the share taken is less than 50 and
  the consent flag is exactly 1, a partner must not leave.
source: evolved (add_condition) from E2-at-least-half
