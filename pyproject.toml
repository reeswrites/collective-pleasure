[project]
name = "mar"
version = "0.0.1"
description = "Multi-agent rules: proof-gated rule search for AI agent groups"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "z3-solver>=5.4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
