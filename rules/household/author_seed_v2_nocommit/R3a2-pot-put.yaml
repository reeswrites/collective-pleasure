id: R3a2-pot-put
attribute: partner
deontic: may
aim: spend_shared
conditions: []
or_else: null
gloss: Either partner may put their own money into the shared pot; this card sets no obligation to; an obligation exists only if members negotiate one as a separate pot card.
source: 'docs/seeds/author-household-norms-2026-11-10.md, "Correction after read-back" (2026-11-10), the author''s words: "the ideal is that yes everyhting hsared always is the shared pot part"; and "What ''the pot belongs to both'' means" (2026-11-10), where Claude offered three readings and the author answered "1" (one pot both can draw from, by whatever terms they negotiated; with no specific terms either may use it for anything). Seed v2 rule R3a, rewritten 2026-11-10 after that answer: the earlier gloss ("either may use it for shared needs; neither may block the other''s use") was Claude''s restriction and is withdrawn. Pot terms are negotiated by everyone who shares the pot (docs/decisions/0013-negotiated-pots.md).'
