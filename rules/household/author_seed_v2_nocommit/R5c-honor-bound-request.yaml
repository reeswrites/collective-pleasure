id: R5c-honor-bound-request
attribute: partner
deontic: must_not
aim: refuse_request
conditions:
- {expr: bound_request, op: eq, value: 1}
or_else: null
gloss: A partner must not refuse a request that they earlier chose to bind themselves to honor; one who breaks it anyway pays the agreed fine.
source: 'docs/seeds/author-household-norms-2026-11-10.md, "Correction after read-back" (2026-11-10), the author''s words: "the other person can always say no unless chosen bound". Formalized 2026-11-10 (lint check e): this is the "unless chosen bound" half of R5 as its own card, so the card set alone says what the commitment mechanics of the world do. It forbids refusing a request the partner chose to be bound by (the flag `bound_request`, exposed from the world); the world lets a bound partner under heavy load break it, paying the agreed fine (REQUEST_FINE). In the nocommit variant no request commitment can be made, so the flag is always 0 and this card never applies.'
