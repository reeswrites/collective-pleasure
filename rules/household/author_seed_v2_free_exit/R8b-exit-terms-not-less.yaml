id: R8b-exit-terms-not-less
attribute: partner
deontic: must_not
aim: leave
conditions:
- {expr: pooled, op: gt, value: 0}
- {expr: take, op: lt, value: 50}
or_else: null
gloss: On leaving, a partner takes at least half of the shared pot (stub for the exit terms agreed beforehand).
source: 'docs/seeds/author-household-norms-2026-11-10.md, the author''s words: "it triggers exit conditions that wer enegotiated before". Seed v2 rule R8. ASSUMED stub: the negotiation phase is not built, so the negotiated exit terms are fixed to an even split. Seed v2.1 (2026-11-10): R3b removed; pot terms are negotiated by everyone who shares the pot (docs/decisions/0013-negotiated-pots.md). The stub exit terms stand only where no negotiation runs; a negotiation replaces them with the negotiated exit term.'
