id: R4-may-ask
attribute: partner
deontic: may
aim: request
conditions:
- {expr: refused_recently, op: eq, value: 0}
or_else: null
gloss: A partner may ask the other for anything, except repeating a request the other has just refused (seed v2.3 decency floor, R11-decency-floor).
source: 'docs/seeds/author-household-norms-2026-11-10.md, "Correction after read-back" (2026-11-10), the author''s words: "the person can ask and the other person can always say no unless chosen bound". Seed v2 rule R4. Encoded as a permission on `request`. Seed v2.2 (2026-11-10, pending author read-back): R3b stays removed; pot terms are negotiated by everyone who shares the pot (docs/decisions/0013-negotiated-pots.md). Seed v2.3 copy (2026-11-11): gloss adds the exception R11-decency-floor makes (rule 18, confirmed by the author); the v2.2 card is unchanged.'
