id: R5c-honor-bound-request
attribute: partner
deontic: must_not
aim: refuse_request
conditions:
- {expr: bound_request, op: eq, value: 1}
or_else: null
gloss: A partner must not refuse a request that they earlier chose to bind themselves to honor. This is a norm with no formal penalty; breaking it lowers the other partner's trust in them, and a fine applies only if the members negotiated one.
source: 'docs/seeds/author-household-norms-2026-11-10.md, "Correction after read-back" (2026-11-10), the author''s words: "the other person can always say no unless chosen bound", and at the read-back of seed v2: "i feel like with 8 we could maybe also have implicit penalties". Seed v2.2 (2026-11-10, pending author read-back): rule 8 is a norm (ADICO with no or-else): no sanction is written on the card. The implicit consequence is modeled in the world, not in the rules: a tracked trust value per partner that falls on a breach and recovers slowly (rules/README.md, "Trust"; parameters ASSUMED in src/mar/worlds/household.py TRUST). An explicit fine exists only when a negotiated term (card N8-fine-some) specifies one. The flag `bound_request` is exposed from the world; in the nocommit variant no request commitment can be made, so the flag is always 0 and this card never applies.'
